spring.application.name=tasfb2b-backend
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# MySQL - dp1_tasf_db
spring.datasource.url=jdbc:mysql://localhost:3306/dp1_tasf_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=Password123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate crea/actualiza tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Permite archivos grandes (múltiples envíos)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=3000MB